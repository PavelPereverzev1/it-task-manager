{% extends "base.html" %}

{% block title %}Delete Task - IT Task Manager{% endblock %}

{% block content %}
  <div class="container-fluid pt-4">
    <div class="row">
      <div class="col-md-6 mx-auto">
        <div class="card shadow border-danger">
          <div class="card-header bg-danger text-white fw-bold py-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Deletion
          </div>
          <div class="card-body py-4 text-center">
            <p class="fs-5 mb-4 text-secondary">
              Are you sure you want to permanently delete the task <strong class="text-dark">"{{ task.name }}"</strong>?
            </p>

            <form method="post">
              {% csrf_token %}
              <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'manager:task-detail' task.id %}" class="btn btn-outline-secondary px-4 fw-bold">
                  Cancel
                </a>
                <button type="submit" class="btn btn-danger px-4 fw-bold">
                  Yes, Delete
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
