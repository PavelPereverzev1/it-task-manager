{% extends "base.html" %}

{% block title %}Dashboard - IT Task Manager{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Dashboard</h1>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4 mb-4">
    <div class="col">
      <div class="card h-100 border-start border-primary border-4 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 font-weight-bold">Total Tasks</h6>
              <h2 class="mb-0 font-weight-bold">{{ num_tasks }}</h2>
            </div>
            <div class="text-primary fs-1"><i class="bi bi-journal-text"></i></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card h-100 border-start border-danger border-4 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 font-weight-bold">Critical Tasks</h6>
              <h2 class="mb-0 font-weight-bold">{{ num_critical_tasks }}</h2>
            </div>
            <div class="text-danger fs-1"><i class="bi bi-exclamation-triangle"></i></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card h-100 border-start border-success border-4 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 font-weight-bold">Total Workers</h6>
              <h2 class="mb-0 font-weight-bold">{{ num_workers }}</h2>
            </div>
            <div class="text-success fs-1"><i class="bi bi-people"></i></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card h-100 border-start border-warning border-4 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-muted text-uppercase fs-7 font-weight-bold">Positions</h6>
              <h2 class="mb-0 font-weight-bold">{{ num_positions }}</h2>
            </div>
            <div class="text-warning fs-1"><i class="bi bi-briefcase"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
