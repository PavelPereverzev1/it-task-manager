<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
  <h1 class="h2">Dashboard</h1>
</div>

<h3 class="h4 mb-3 text-secondary mt-4">System Statistics</h3>
<div class="row g-3">

  <div class="col-md-6 col-lg-3">
    <div class="card shadow-sm h-100 border-start border-4 border-primary position-relative">
      <div class="card-body">
        <h6 class="card-subtitle mb-2 text-muted uppercase font-weight-bold">Total Tasks</h6>
        <p class="card-text fs-2 fw-bold text-dark mb-0">{{ num_tasks }}</p>
        <a href="{% url 'manager:task-all-list' %}" class="stretched-link"></a>
      </div>
    </div>
  </div>

  <div class="col-md-6 col-lg-3">
    <div class="card shadow-sm h-100 border-start border-4 border-danger">
      <div class="card-body">
        <h6 class="card-subtitle mb-2 text-muted uppercase font-weight-bold">Critical Priority</h6>
        <p class="card-text fs-2 fw-bold text-danger mb-0">{{ num_critical_tasks }}</p>
      </div>
    </div>
  </div>

  <div class="col-md-6 col-lg-3">
    <div class="card shadow-sm h-100 border-start border-4 border-success">
      <div class="card-body">
        <h6 class="card-subtitle mb-2 text-muted uppercase font-weight-bold">Active Workers</h6>
        <p class="card-text fs-2 fw-bold text-dark mb-0">{{ num_workers }}</p>
      </div>
    </div>
  </div>

  <div class="col-md-6 col-lg-3">
    <div class="card shadow-sm h-100 border-start border-4 border-warning">
      <div class="card-body">
        <h6 class="card-subtitle mb-2 text-muted uppercase font-weight-bold">Positions Types</h6>
        <p class="card-text fs-2 fw-bold text-dark mb-0">{{ num_positions }}</p>
      </div>
    </div>
  </div>

</div>
