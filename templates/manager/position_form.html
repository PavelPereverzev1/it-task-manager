{% extends "base.html" %}
{% block title %}Create Position - IT Task Manager{% endblock %}

{% block content %}
  <div class="container ps-0 mx-auto w-50">
    <div class="card shadow-sm border-0 my-4">
      <div class="card-body p-4">
        <h2 class="mb-4 fw-bold text-dark"><i class="bi bi-plus-square text-primary me-2"></i>Create Position</h2>
        <hr class="mb-4">

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary" for="id_name">Position Name</label>
            <input type="text" name="name" id="id_name" class="form-control" required
                   placeholder="e.g. Senior Python Developer">
            {% if form.name.errors %}
              <div class="text-danger small mt-1">{{ form.name.errors.0 }}</div>
            {% endif %}
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4 fw-bold">Save</button>
            <a href="{% url 'manager:position-list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
