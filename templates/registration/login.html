{% extends "base.html" %}

{% block title %}Login - IT Task Manager{% endblock %}

{% block content %}
  <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="text-center mb-4 fw-bold text-dark">
            <i class="bi bi-shield-lock text-primary"></i> Sign In
          </h2>

          {% if form.errors %}
            <div class="alert alert-danger" role="alert">
              Your username and password didn't match. Please try again.
            </div>
          {% endif %}

          <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
              <label for="id_username" class="form-label">Username</label>
              <input type="text" name="username" autofocus required id="id_username" class="form-control">
            </div>

            <div class="mb-3">
              <label for="id_password" class="form-label">Password</label>
              <input type="password" name="password" required id="id_password" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
